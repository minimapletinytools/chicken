name: eBay Watch

on:
  push:
    branches:
      - main
  schedule:
    # Roughly every 2 days (day-of-month step; cron has no native "every N
    # days" so this resets at each month boundary, e.g. day 31 -> day 1).
    - cron: "17 6 */2 * *"
  workflow_dispatch:
    inputs:
      issue_mode:
        description: "How to report hits"
        type: choice
        default: comment
        options:
          - comment
          - new
      price_drop_threshold_pct:
        description: "Alert threshold: BIN min drop % below all-time low"
        type: string
        default: "20"
      max_issue_comments:
        description: "Max comments before closing and opening a new issue"
        type: string
        default: "10"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ebay-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r ebay-watch/requirements.txt

      - name: Run eBay watch
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_MODE: ${{ inputs.issue_mode || 'comment' }}
          PRICE_DROP_THRESHOLD_PCT: ${{ inputs.price_drop_threshold_pct || '20' }}
          MAX_ISSUE_COMMENTS: ${{ inputs.max_issue_comments || '10' }}
        run: python ebay-watch/scripts/ebay_watch.py

      - name: Regenerate price history chart
        run: python ebay-watch/scripts/generate_chart.py

      - name: Commit updated price cache and chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/data/ebay-watch ebay-watch/docs/index.html
          git diff --cached --quiet || git commit -m "Update eBay price cache [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build / stage Pages directory
        run: |
          mkdir -p _site/ebaywatcher
          cp ebay-watch/docs/index.html _site/ebaywatcher/index.html
          cat << 'EOF' > _site/index.html
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=ebaywatcher/">
            <title>Projects</title>
          </head>
          <body>
            <p>Redirecting to <a href="ebaywatcher/">eBay Watcher</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: watch
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
