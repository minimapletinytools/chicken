  #legend {

  .legend-row {
    display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px;

  .legend-row:hover, .legend-row.legend-active { background-color: rgba(255,255,255,0.12); }
  .legend-row.legend-hidden { opacity: 0.35; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1 1 auto; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-link { color: #8ab4f8; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; }

", "total_count": 1}]}, {"id": "spyderco-pkal", "query": "Spyderco P'Kal", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 26, "bin_max": 731.99, "bin_median": 291.75, "bin_min": 194.95, "timestamp": "2026-07-10T21:18:25.555639+00:00", "total_count": 26}, {"bin_count": 26, "bin_max": 731.99, "bin_median": 291.75, "bin_min": 194.95, "timestamp": "2026-07-10T21:48:15.487176+00:00", "total_count": 26}]}, {"id": "spyderco-poliwog", "query": "Spyderco Poliwog", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 4, "bin_max": 395.0, "bin_median": 282.0, "bin_min": 275.0, "timestamp": "2026-07-10T21:18:26.005114+00:00", "total_count": 4}, {"bin_count": 4, "bin_max": 395.0, "bin_median": 282.0, "bin_min": 275.0, "timestamp": "2026-07-10T21:48:15.846282+00:00", "total_count": 4}]}, {"id": "spyderco-essenza", "query": "Spyderco Essenza", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 15, "bin_max": 192.12, "bin_median": 176.25, "bin_min": 158.63, "timestamp": "2026-07-10T21:18:26.498404+00:00", "total_count": 15}, {"bin_count": 15, "bin_max": 192.12, "bin_median": 176.25, "bin_min": 158.63, "timestamp": "2026-07-10T21:48:16.248302+00:00", "total_count": 15}]}, {"id": "spyderco-gooney", "query": "Spyderco Gooney", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 13, "bin_max": 80.0, "bin_median": 60.0, "bin_min": 50.0, "timestamp": "2026-07-10T21:18:27.079813+00:00", "total_count": 13}, {"bin_count": 13, "bin_max": 80.0, "bin_median": 60.0, "bin_min": 50.0, "timestamp": "2026-07-10T21:48:16.833054+00:00", "total_count": 13}]}, {"id": "spyderco-squeak", "query": "Spyderco Squeak", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 31, "bin_max": 229.99, "bin_median": 79.95, "bin_min": 51.95, "timestamp": "2026-07-10T21:18:27.493365+00:00", "total_count": 31}, {"bin_count": 31, "bin_max": 229.99, "bin_median": 79.95, "bin_min": 51.95, "timestamp": "2026-07-10T21:48:17.163353+00:00", "total_count": 31}]}, {"id": "spyderco-mcbee", "query": "Spyderco McBee", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 50, "bin_max": 400.0, "bin_median": 195.0, "bin_min": 16.88, "timestamp": "2026-07-10T21:18:28.007331+00:00", "total_count": 50}, {"bin_count": 50, "bin_max": 400.0, "bin_median": 195.0, "bin_min": 16.88, "timestamp": "2026-07-10T21:48:17.542137+00:00", "total_count": 50}]}, {"id": "spyderco-cat", "query": "Spyderco Cat", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 23, "bin_max": 219.98, "bin_median": 78.75, "bin_min": 15.03, "timestamp": "2026-07-10T21:18:28.483342+00:00", "total_count": 23}, {"bin_count": 23, "bin_max": 219.98, "bin_median": 78.75, "bin_min": 15.03, "timestamp": "2026-07-10T21:48:17.894937+00:00", "total_count": 23}]}, {"id": "spyderco-jester", "query": "Spyderco Jester", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 3, "bin_max": 258.65, "bin_median": 189.99, "bin_min": 175.0, "timestamp": "2026-07-10T21:18:28.960104+00:00", "total_count": 3}, {"bin_count": 3, "bin_max": 258.65, "bin_median": 189.99, "bin_min": 175.0, "timestamp": "2026-07-10T21:48:18.228628+00:00", "total_count": 3}]}, {"id": "spyderco-retract", "query": "Spyderco Retract", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 0, "bin_max": null, "bin_median": null, "bin_min": null, "timestamp": "2026-07-10T21:18:29.307557+00:00", "total_count": 0}, {"bin_count": 0, "bin_max": null, "bin_median": null, "bin_min": null, "timestamp": "2026-07-10T21:48:18.598404+00:00", "total_count": 0}]}, {"id": "spyderco-kris", "query": "Spyderco Kris", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 0, "bin_max": null, "bin_median": null, "bin_min": null, "timestamp": "2026-07-10T21:18:29.596889+00:00", "total_count": 0}, {"bin_count": 0, "bin_max": null, "bin_median": null, "bin_min": null, "timestamp": "2026-07-10T21:48:18.953986+00:00", "total_count": 0}]}, {"id": "spyderco-spyderench", "query": "Spyderco SpydeRench", "tags": ["knives", "spyderco", "normal"], "history": [{"bin_count": 10, "bin_max": 777.24, "bin_median": 649.98, "bin_min": 299.99, "timestamp": "2026-07-10T21:18:30.022380+00:00", "total_count": 10}, {"bin_count": 10, "bin_max": 777.24, "bin_median": 649.98, "bin_min": 299.99, "timestamp": "2026-07-10T21:48:19.330565+00:00", "total_count": 10}]}];

const COLORS = ['#e6194b','#3cb44b','#ffe119','#4363d8','#f58231','#911eb4','#46f0f0',
  '#f032e6','#bcf60c','#fabebe','#008080','#e6beff','#9a6324','#fffac8','#800000',
  '#aaffc3','#808000','#ffd8b1','#000075','#a9a9a9','#ffffff'];

function ebaySearchUrl(query) {
  return 'https://www.ebay.com/sch/i.html?_nkw=' + encodeURIComponent(query);
}

const allTags = [...new Set(DATA.flatMap(d => d.tags))].sort();
const tagsEl = document.getElementById('tags');
allTags.forEach(tag => {
  const label = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = true;
  cb.value = tag;
  cb.addEventListener('change', render);
  label.appendChild(cb);
  label.append(' ' + tag);
  tagsEl.appendChild(label);
});

let chart;

function buildLegend(visible) {
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  visible.forEach((d, i) => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.dataset.index = String(i);

    const swatch = document.createElement('span');
    swatch.className = 'legend-swatch';
    swatch.style.backgroundColor = COLORS[i % COLORS.length];

    const label = document.createElement('span');
    label.className = 'legend-label';
    label.textContent = d.query;
    label.title = d.query;

    const link = document.createElement('a');
    link.className = 'legend-link';
    link.href = ebaySearchUrl(d.query);
    link.target = '_blank';
    link.rel = 'noopener';
    link.title = 'Open eBay search in new tab';
    link.textContent = '↗';
    link.addEventListener('click', event => event.stopPropagation());

    row.append(swatch, label, link);
    row.addEventListener('click', () => {
      if (chart.isDatasetVisible(i)) {
        chart.hide(i);
        row.classList.add('legend-hidden');
      } else {
        chart.show(i);
        row.classList.remove('legend-hidden');
      }
    });

    legendEl.appendChild(row);
  });
}

function highlightLegendRow(datasetIndex) {
  document.querySelectorAll('.legend-row').forEach(row => {
    row.classList.toggle('legend-active', row.dataset.index === String(datasetIndex));
  });
}

function render() {
  const metric = document.getElementById('metric').value;
  const active = new Set([...tagsEl.querySelectorAll('input:checked')].map(cb => cb.value));
  const visible = DATA.filter(d => d.tags.some(t => active.has(t)));

  const datasets = visible.map((d, i) => ({
    label: d.query,
    data: d.history.map(h => ({ x: h.timestamp, y: h[metric] })),
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length],
    spanGaps: true,
    tension: 0.15,
    pointRadius: 2,
  }));

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      interaction: { mode: 'nearest', intersect: true },
      onHover: (event, elements) => {
        highlightLegendRow(elements.length ? elements[0].datasetIndex : -1);
      },
      scales: {
        x: { type: 'time', time: { unit: 'day' }, ticks: { color: '#ccc' }, grid: { color: '#333' } },
        y: { ticks: { color: '#ccc' }, grid: { color: '#333' }, title: { display: true, text: 'USD', color: '#ccc' } },
      },
      plugins: { legend: { display: false } },
    },
  });

  buildLegend(visible);
}

document.getElementById('metric').addEventListener('change', render);
render();
</script>
