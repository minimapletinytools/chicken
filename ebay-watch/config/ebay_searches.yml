# eBay watch list.
#
# Each entry is one saved search. `id` must be unique and stable — it's used
# as the cache filename, so renaming it resets that search's price history.
#
# Fields:
#   id               (required) unique slug, e.g. "rtx-3080-fe"
#   query            (required) eBay search text
#   tags             (optional) list of free-text tags (e.g. [knives, spyderco]);
#                      used to group/filter in alerts and the price-history
#                      visualizer. priority (below) is also treated as an
#                      implicit tag in the visualizer.
#   priority         (optional) "high" | "normal" (default "normal"); high
#                      priority alerts are sorted first and marked
#   price_drop_threshold_pct (optional) overrides PRICE_DROP_THRESHOLD_PCT
#                      (default 20) for this search — how far the BIN min
#                      must drop below its all-time low to trigger an alert
#   category_ids     (optional) eBay category id(s), comma-separated string
#   condition        (optional) NEW | USED | NEW_OTHER | CERTIFIED_REFURBISHED
#                      | SELLER_REFURBISHED | omit for any condition
#   max_price        (optional) hard ceiling in USD; listings above this are
#                      ignored entirely, regardless of price history
#   exclude_keywords (optional) list of case-insensitive substrings; a listing
#                      whose title contains any of these is skipped
#   marketplace      (optional) defaults to EBAY_US

